<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FolditLite · Instructor</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />

<style>
/* Tokens — kept in sync with FolditLite.html */
:root {
  --bg:        oklch(0.165 0.013 240);
  --bg-2:      oklch(0.195 0.014 240);
  --surface:   oklch(0.215 0.014 240);
  --surface-2: oklch(0.255 0.015 240);
  --border:    oklch(0.305 0.014 240);
  --border-2:  oklch(0.36 0.016 240);
  --text:      oklch(0.965 0.005 80);
  --text-dim:  oklch(0.78 0.008 240);
  --muted:     oklch(0.62 0.012 240);
  --muted-2:   oklch(0.5 0.013 240);
  --accent:    oklch(0.82 0.14 168);
  --accent-bg: oklch(0.32 0.06 168 / 0.18);
  --good:      oklch(0.83 0.16 150);
  --warn:      oklch(0.82 0.14 78);
  --danger:    oklch(0.74 0.16 24);
  --info:      oklch(0.78 0.12 235);
  --violet:    oklch(0.75 0.16 305);
  --radius: 8px;
  --radius-lg: 14px;
  --shadow-1: 0 1px 0 0 oklch(1 0 0 / 0.03) inset, 0 1px 2px oklch(0 0 0 / 0.35);
  --shadow-2: 0 1px 0 0 oklch(1 0 0 / 0.04) inset, 0 8px 24px -8px oklch(0 0 0 / 0.5);
  --font-sans: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
  --font-serif: "IBM Plex Serif", ui-serif, Georgia, serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}

* { box-sizing: border-box; }
html, body, #root { margin: 0; min-height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 13px;
  -webkit-font-smoothing: antialiased;
  background:
    radial-gradient(1200px 700px at 90% -10%, oklch(0.3 0.04 168 / 0.16), transparent 55%),
    radial-gradient(900px 600px at -10% 110%, oklch(0.28 0.04 280 / 0.12), transparent 55%),
    var(--bg);
}

/* ---------- Topbar ---------- */
.topbar {
  display: flex; align-items: center; gap: 14px;
  padding: 0 18px;
  height: 52px;
  border-bottom: 1px solid var(--border);
  background: color-mix(in oklch, var(--bg) 65%, transparent);
  backdrop-filter: blur(10px);
  position: sticky; top: 0;
  z-index: 5;
}
.brand { display: flex; align-items: center; gap: 9px; font-weight: 600; }
.brand-mark {
  width: 22px; height: 22px; border-radius: 6px;
  background: linear-gradient(135deg, oklch(0.82 0.14 168), oklch(0.72 0.16 200));
  display: grid; place-items: center;
  box-shadow: 0 1px 0 0 oklch(1 0 0 / 0.18) inset, 0 4px 12px -2px oklch(0.7 0.14 168 / 0.4);
}
.brand-mark svg { width: 13px; height: 13px; stroke: oklch(0.18 0.02 200); }
.crumb-sep { color: var(--muted-2); }
.crumb-current { color: var(--text); font-weight: 500; }
.role-badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px;
  border-radius: 999px;
  background: color-mix(in oklch, var(--violet) 15%, transparent);
  color: var(--violet);
  font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.08em;
}
.topbar-spacer { flex: 1; }
.tab-link {
  padding: 6px 12px;
  border-radius: 6px;
  color: var(--muted);
  font-size: 12.5px; font-weight: 500;
  text-decoration: none;
}
.tab-link:hover { color: var(--text); background: var(--surface); }
.tab-link.on { color: var(--text); background: var(--surface); }
.avatar {
  width: 26px; height: 26px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--violet), oklch(0.65 0.18 235));
  display: grid; place-items: center;
  font-size: 11px; font-weight: 600;
  color: oklch(1 0 0 / 0.95);
}

/* ---------- Page shell ---------- */
.page {
  max-width: 1240px;
  margin: 0 auto;
  padding: 32px 28px 64px;
  display: flex; flex-direction: column; gap: 26px;
}

.page-head {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
}
.page-eyebrow {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em;
  color: var(--muted);
  font-weight: 600;
  margin-bottom: 6px;
}
.page-title {
  font-family: var(--font-serif);
  font-size: 30px;
  font-weight: 500;
  letter-spacing: -0.02em;
  margin: 0;
}
.page-meta {
  display: flex; gap: 14px;
  color: var(--muted);
  font-size: 12.5px;
  margin-top: 4px;
}
.page-meta b { color: var(--text); font-weight: 500; }

.head-actions { display: flex; gap: 8px; align-items: center; }
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  height: 34px; padding: 0 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  font: inherit; font-size: 12.5px;
  border-radius: 8px;
  cursor: pointer;
}
.btn:hover { border-color: var(--border-2); background: var(--surface-2); }
.btn.primary {
  background: var(--accent); border-color: var(--accent);
  color: oklch(0.18 0.02 200);
  font-weight: 600;
}
.btn svg { width: 13px; height: 13px; }

/* ---------- KPI cards ---------- */
.kpis {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
}
.kpi {
  position: relative;
  padding: 16px 18px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  display: flex; flex-direction: column; gap: 6px;
}
.kpi::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(200px 120px at 90% 0%, color-mix(in oklch, var(--kpi-tint, var(--accent)) 16%, transparent), transparent 70%);
  pointer-events: none;
}
.kpi-label {
  font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--muted);
  font-weight: 600;
  position: relative;
}
.kpi-value {
  font-family: var(--font-mono);
  font-weight: 600;
  font-size: 28px;
  letter-spacing: -0.02em;
  color: var(--text);
  position: relative;
  line-height: 1;
}
.kpi-value small {
  font-size: 14px;
  color: var(--muted);
  font-weight: 400;
}
.kpi-sub {
  font-size: 11.5px; color: var(--muted);
  position: relative;
}
.kpi-sub .good { color: var(--good); }
.kpi-sub .bad  { color: var(--danger); }

/* ---------- Section card ---------- */
.section-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
}
.section-card-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
}
.section-card-head h2 {
  margin: 0;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0;
}
.section-card-head .head-meta {
  font-size: 11.5px; color: var(--muted);
}

/* ---------- Layout columns ---------- */
.main-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr);
  gap: 18px;
}
@media (max-width: 1000px) {
  .main-grid { grid-template-columns: 1fr; }
  .kpis { grid-template-columns: repeat(2, 1fr); }
}

/* ---------- Student table ---------- */
.filter-row {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 18px;
  border-bottom: 1px solid var(--border);
}
.search-input {
  flex: 1;
  height: 30px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 0 10px;
  border-radius: 6px;
  font: inherit;
  font-size: 12.5px;
}
.search-input:focus { outline: none; border-color: var(--accent); }
.chip-filter {
  height: 26px; padding: 0 10px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  color: var(--muted);
  border-radius: 999px;
  font: inherit; font-size: 11.5px;
  cursor: pointer;
}
.chip-filter:hover { color: var(--text); }
.chip-filter.on {
  background: var(--accent-bg);
  color: var(--accent);
  border-color: color-mix(in oklch, var(--accent) 50%, var(--border));
}

table.roster {
  width: 100%;
  border-collapse: collapse;
}
.roster th {
  text-align: left;
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
  font-weight: 600;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  position: sticky; top: 52px;
}
.roster td {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
  vertical-align: middle;
}
.roster tr:last-child td { border-bottom: 0; }
.roster tr:hover td { background: var(--bg-2); }
.roster .col-progress { min-width: 180px; }
.roster .student {
  display: flex; align-items: center; gap: 10px;
}
.student-avatar {
  width: 28px; height: 28px;
  border-radius: 50%;
  display: grid; place-items: center;
  font-size: 11px; font-weight: 600;
  color: oklch(0.18 0.02 200);
  flex: 0 0 auto;
}
.student-name { font-weight: 500; color: var(--text); }
.student-sub { color: var(--muted); font-size: 11.5px; }

.progress {
  position: relative;
  height: 6px;
  background: var(--bg-2);
  border-radius: 999px;
  overflow: hidden;
}
.progress-fill {
  position: absolute; inset: 0 auto 0 0;
  background: var(--accent);
  border-radius: 999px;
}
.progress-meta {
  display: flex; justify-content: space-between;
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--muted);
  margin-top: 4px;
}

.status-pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 500;
  white-space: nowrap;
}
.status-pill .dot {
  width: 6px; height: 6px;
  border-radius: 50%;
}
.status-pill.solved { background: color-mix(in oklch, var(--good) 14%, transparent); color: var(--good); }
.status-pill.solved .dot { background: var(--good); }
.status-pill.in-progress { background: color-mix(in oklch, var(--info) 14%, transparent); color: var(--info); }
.status-pill.in-progress .dot { background: var(--info); animation: pulse 1.5s ease-in-out infinite; }
.status-pill.stuck { background: color-mix(in oklch, var(--warn) 14%, transparent); color: var(--warn); }
.status-pill.stuck .dot { background: var(--warn); }
.status-pill.idle { background: var(--surface-2); color: var(--muted); }
.status-pill.idle .dot { background: var(--muted-2); }

@keyframes pulse {
  0%,100% { opacity: 0.4; transform: scale(0.85); }
  50%     { opacity: 1; transform: scale(1); }
}

.last-active {
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 11.5px;
}

.row-actions {
  display: inline-flex; gap: 4px;
}
.icon-btn {
  width: 26px; height: 26px;
  display: grid; place-items: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 5px;
  color: var(--muted);
  cursor: pointer;
}
.icon-btn:hover { background: var(--surface-2); color: var(--text); border-color: var(--border); }
.icon-btn svg { width: 13px; height: 13px; }

/* ---------- Right rail (puzzle stats + activity) ---------- */
.right-col { display: flex; flex-direction: column; gap: 18px; }

.puzzle-row {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 12px;
  align-items: center;
  padding: 12px 18px;
  border-bottom: 1px solid var(--border);
}
.puzzle-row:last-child { border-bottom: 0; }
.puzzle-row .pno { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.puzzle-row .pname { font-weight: 500; font-size: 13px; }
.puzzle-row .pmeta { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }

.puzzle-bar {
  display: flex;
  height: 8px;
  border-radius: 999px;
  overflow: hidden;
  background: var(--bg-2);
  margin-top: 6px;
}
.puzzle-bar > * { display: block; height: 100%; }
.puzzle-bar .solved { background: var(--good); }
.puzzle-bar .in-progress { background: var(--info); }
.puzzle-bar .stuck { background: var(--warn); }
.puzzle-bar .idle { background: var(--muted-2); opacity: 0.4; }

.bar-legend {
  display: flex; gap: 12px;
  font-size: 11px;
  color: var(--muted);
  margin-top: 8px;
}
.bar-legend .lk { display: inline-flex; align-items: center; gap: 4px; }
.bar-legend .sw {
  width: 7px; height: 7px; border-radius: 50%;
}
.sw.solved { background: var(--good); }
.sw.in-progress { background: var(--info); }
.sw.stuck { background: var(--warn); }
.sw.idle { background: var(--muted-2); opacity: 0.5; }

.activity { display: flex; flex-direction: column; }
.activity-item {
  display: grid;
  grid-template-columns: 32px 1fr auto;
  gap: 10px;
  align-items: center;
  padding: 10px 18px;
  border-bottom: 1px solid var(--border);
}
.activity-item:last-child { border-bottom: 0; }
.activity-ico {
  width: 24px; height: 24px;
  border-radius: 50%;
  display: grid; place-items: center;
  background: var(--bg-2);
  color: var(--muted);
}
.activity-ico svg { width: 12px; height: 12px; }
.activity-ico.solved { color: var(--good); background: color-mix(in oklch, var(--good) 14%, transparent); }
.activity-ico.stuck  { color: var(--warn); background: color-mix(in oklch, var(--warn) 14%, transparent); }
.activity-ico.tutor  { color: var(--info); background: color-mix(in oklch, var(--info) 14%, transparent); }
.activity-body { font-size: 12.5px; color: var(--text-dim); }
.activity-body b { color: var(--text); font-weight: 500; }
.activity-time { font-family: var(--font-mono); font-size: 11px; color: var(--muted-2); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="instructor.jsx"></script>
